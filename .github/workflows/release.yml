name: 构建发布产物

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GOPRIVATE: github.com/DouDOU-start/airgate-sdk
  GOTOOLCHAIN: local

jobs:
  release:
    name: 检查并生成发布产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 校验发布标签
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "发布 workflow 必须从 v* tag 触发，当前 ref: ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: 安装前端依赖
        run: cd web && pnpm install --frozen-lockfile

      - name: 运行完整检查
        run: make ci

      - name: 构建 Linux amd64 发布产物
        run: VERSION="${VERSION}" make release

      - name: 生成 SHA256
        run: |
          cd bin
          sha256sum airgate-studio-linux-amd64 > airgate-studio-linux-amd64.sha256

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: airgate-studio-linux-amd64
          path: |
            bin/airgate-studio-linux-amd64
            bin/airgate-studio-linux-amd64.sha256
          retention-days: 14

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            bin/airgate-studio-linux-amd64
            bin/airgate-studio-linux-amd64.sha256
